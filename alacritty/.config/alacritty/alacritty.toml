# General settings
[general]
live_config_reload = true   # Reloads settings automatically when you save
import = [
    "~/.config/alacritty/themes/catppuccin_mocha.toml"
]

# Window styling
[window]
padding = { x = 3, y = 3 }
dynamic_padding = true

# Font configuration
[font]
size = 11.0

[font.normal]
family = "JetBrains Mono"        # Change to "Fira Code", "JetBrains Mono", etc.
style = "Regular"

# Cursor customizations
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750

# Scrolling history
[scrolling]
history = 10000             # Number of lines kept in memory

#auto launch zellij
[terminal.shell]
program = "zellij"
# Optional arguments (e.g., to attach to an existing session or start fresh)
# args = ["options", "--attach-to-session", "true"]

